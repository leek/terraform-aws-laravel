[PHP]
memory_limit = 256M
max_execution_time = 300
max_input_vars = 3000
upload_max_filesize = 32M
post_max_size = 32M
expose_php = Off
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
allow_url_fopen = Off
allow_url_include = Off
pcre.backtrack_limit = 10000000
pcre.recursion_limit = 10000000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
zend.assertions = -1

[opcache]
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
; 32531 is the prime just above 32k recommended for large Laravel/Filament apps.
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.max_wasted_percentage = 10
opcache.interned_strings_buffer = 32
opcache.fast_shutdown = 1
; JIT is opt-in. Uncomment for CPU-bound workloads. The tracing JIT plus a
; 256M buffer is a sensible starting point; profile before enabling in prod.
; opcache.jit = tracing
; opcache.jit_buffer_size = 256M

[apcu]
apc.enabled = 1
apc.enable_cli = 1
; Default 32M is small for the Composer APCu autoloader cache on Filament apps.
apc.shm_size = 64M

[Date]
date.timezone = UTC
